name: Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "cloudflare"
  cancel-in-progress: false

jobs:
  Deployment:
    runs-on: ubuntu-latest
    environment:
      name: Cloudflare
      url: https://iiro.fi
    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout/commit/3d3c42e5aac5ba805825da76410c181273ba90b1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        # https://github.com/actions/setup-node/commit/820762786026740c76f36085b0efc47a31fe5020
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ".node-version"
          package-manager-cache: false

      - name: Restore npm cache
        # https://github.com/actions/cache/commit/55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: npm-cache
        with:
          path: node_modules
          key: ${{ hashFiles('package-lock.json') }}

      - name: Run npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Save npm cache
        if: steps.npm-cache.outputs.cache-hit != 'true'
        # https://github.com/actions/cache/commit/55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      - name: Build
        run: npm run build

      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
